<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraitPilot</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e232c; --border:#2a303b;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#e07856; --accent2:#f0a486;
    --ok:#4ade80; --err:#f87171; --warn:#facc15;
    --code:#12161d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#333b48;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:flex;height:100vh}

  /* ---------- 侧栏 ---------- */
  aside{width:288px;min-width:288px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column}
  .brand{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
    justify-content:space-between}
  .brand .bl{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#b95f46);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
  .brand .t1{font-weight:700;font-size:15px}
  .brand .t2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;
    font-size:12px;padding:4px 8px;cursor:pointer;flex-shrink:0}
  .brand .icon-btn:hover{color:var(--text);border-color:var(--accent)}

  .skill-head{padding:12px 16px 6px;font-size:11px;color:var(--muted);letter-spacing:.08em;
    display:flex;justify-content:space-between;align-items:center}
  .skill-head .mini{background:transparent;border:none;color:var(--accent);font-size:11px;cursor:pointer;
    padding:0;font-family:inherit}
  .skill-head .mini:hover{color:var(--accent2)}
  #sessionList{flex:1;overflow:auto;padding:4px 8px 16px}
  .sess{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:9px 10px;margin:6px 4px;cursor:pointer;transition:border-color .15s}
  .sess:hover{border-color:var(--accent)}
  .sess.active{border-color:var(--accent);background:#252b36}
  .sess .r1{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .sess .r1 .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .sess .r1 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .r1 .curtl{font-size:9px;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:0 4px;flex-shrink:0}
  .sess .t2{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .sess .dsc{font-size:11px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .sess.arch{opacity:.72}
  .sess-group{padding:12px 12px 4px;font-size:11px;color:var(--muted);letter-spacing:.04em;cursor:pointer}
  .sess-group:hover{color:var(--text)}
  .sess-group .caret{color:var(--accent)}

  /* 右键菜单 */
  #ctxMenu{position:fixed;z-index:80;display:none;min-width:140px;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
  #ctxMenu.show{display:block}
  #ctxMenu .ctx-item{display:block;width:100%;text-align:left;background:transparent;border:none;
    color:var(--text);font:13px inherit;padding:7px 10px;border-radius:7px;cursor:pointer}
  #ctxMenu .ctx-item:hover{background:var(--panel2)}
  #ctxMenu .ctx-item.danger{color:var(--err)}
  #ctxMenu .ctx-item.danger:hover{background:rgba(248,113,113,.12)}

  /* ---------- Skills 抽屉 ---------- */
  .drawer{position:fixed;left:0;top:0;bottom:0;width:320px;max-width:92vw;background:var(--panel);
    border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .2s ease;
    z-index:60;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.35)}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;font-weight:700}
  #skillList{flex:1;overflow:auto;padding:4px 8px 16px}
  .skill{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:9px 10px;margin:6px 4px;cursor:pointer;transition:border-color .15s}
  .skill:hover{border-color:var(--accent)}
  .skill .nm{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .skill .inv{font-size:9px;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:0 4px}
  .skill .inv.y{color:var(--ok);border-color:rgba(74,222,128,.4)}
  .skill .dsc{font-size:11px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .skill .tools{font-size:10px;color:#7d8796;margin-top:5px;word-break:break-all}
  .skill .go{margin-top:6px;font-size:11px;color:var(--accent);display:none}
  .skill:hover .go{display:block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
  .scrim.show{display:block}

  .empty{color:var(--muted);font-size:12.5px;padding:8px 2px}

  /* ---------- 主区 ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
    background:var(--panel)}
  header .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  header select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:5px 8px;font-size:12px;outline:none}
  header .spacer{flex:1}
  header .badge{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:20px}
  #connDot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
  #connDot.on{background:var(--ok)}
  header button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;
    font-size:12px;padding:5px 10px;cursor:pointer}
  header button.ghost:hover{color:var(--text);border-color:var(--accent)}

  #chat{flex:1;overflow:auto;padding:22px 26px 10px}
  .msg{max-width:860px;margin:0 auto 20px}
  .msg.user .bubble{background:#272e3a;color:var(--text);
    border:1px solid var(--border);border-radius:16px 16px 4px 16px;padding:11px 14px;
    white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  .msg.assist .bubble{background:var(--panel);border:1px solid var(--border);border-radius:4px 16px 16px 16px;
    padding:4px 16px 12px}
  .msg-role{font-size:11px;color:var(--muted);margin:6px 2px 4px}
  .msg.assist .flow{word-break:break-word}
  .md p{margin:.55em 0}
  .md code{background:var(--code);border:1px solid var(--border);border-radius:5px;padding:1px 5px;
    font:12px "SFMono-Regular",Consolas,monospace}
  .md pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto}
  .md pre code{background:none;border:none;padding:0;display:block}
  .md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:.8em 0 .4em}
  .md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14px}
  .md table{border-collapse:collapse;margin:.6em 0;font-size:12.5px;display:block;overflow:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--border);padding:5px 10px;text-align:left}
  .md th{background:var(--panel2)}
  .md ul,.md ol{padding-left:22px;margin:.5em 0}
  .md blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:2px 14px;color:var(--muted)}
  .md a{color:var(--accent2)}
  .md .dur{color:#7d8796;font-size:11px;margin-top:6px}
  .bubble .tail{color:#7d8796;font-size:11px;margin-top:6px}

  /* 工具卡 */
  .tool-card{border:1px solid var(--border);border-radius:10px;margin:8px 0;
    background:var(--panel2);overflow:hidden}
  .tool-card .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;
    user-select:none;font-size:12.5px}
  .tool-card .ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .tool-card .nm{font-weight:600}
  .tool-card .status{margin-left:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:6px}
  .tool-card .st-ok{color:var(--ok)}.tool-card .st-err{color:var(--err)}.tool-card .st-run{color:var(--warn)}
  .tc-spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tool-card .body{display:none;border-top:1px solid var(--border);padding:10px;font-size:12px}
  .tool-card.open .body{display:block}
  .tool-card .lab{color:var(--muted);font-size:10.5px;margin:6px 0 4px}
  .tool-card pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    overflow:auto;margin:0;font:12px/1.55 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap;word-break:break-word}

  .thinking{color:var(--muted);font-size:12.5px;padding:8px 2px;display:flex;align-items:center;gap:8px}
  .thinking .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* 思考过程（默认只显示前几行，点击展开） */
  .think-box{border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--code);
    overflow:hidden}
  .think-box .thd{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;
    user-select:none;font-size:11.5px;color:var(--muted)}
  .think-box .thd .lb{font-weight:600;color:#8fa1b8}
  .think-box .thd .tip{margin-left:auto;color:#7d8796;font-size:10.5px}
  .think-box .tclamp{padding:2px 12px 8px;font:12px/1.6 "SFMono-Regular",Consolas,monospace;
    color:#9aa3b2;white-space:pre-wrap;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .think-box.open .tclamp{display:block;overflow:auto;max-height:340px}
  .think-box.open .thd .tip::after{content:"（点击收起）"}
  .think-box:not(.open) .thd .tip::after{content:"（点击展开）"}
  .thinking-live{color:var(--muted);font-size:11.5px;padding:4px 2px;display:flex;align-items:center;gap:8px}
  .thinking-live .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}

  /* 长内容折叠：默认只显前几行，点击展开（工具参数 / 结果 / 正文代码块 / 表格 / 引用块）。
     用 max-height 而不是 -webkit-line-clamp，理由：
       ① 只有真的溢出才该出现「点击展开」暗示。max-height 下 scrollHeight/clientHeight
          量得准，能据此判定；line-clamp 的溢出量要 JS 自己算，容易误判。
       ② line-clamp 需要 -webkit-box 布局，套在表格/包装 div 上会改写它们的排版语义。
     --fold-line 是该上下文「一行」的高度（px），裁线因此落在行边界上；
     两处 pre 的 overflow:auto 会盖掉折叠，故 .foldable 的选择器刻意写两遍提特异性。 */
  .foldable.foldable{--fold-lines:6;
    max-height:calc(var(--fold-lines) * var(--fold-line,20px));
    overflow:hidden;position:relative}
  /* 下表按上下文给准「一行的高度」，让裁切线落在行边界上（--fold-lines 默认 6 行） */
  .md pre.foldable{--fold-line:19.2px;--fold-lines:5;font:12px/1.6 "SFMono-Regular",Consolas,monospace}
  .md pre.foldable code{line-height:1.6}          /* .md code 的 font 简写把行高重置成了 normal */
  /* .md pre 有上下各 12px 的 padding，5*19.2+24=120 = 正文行高 1.6 的整数倍，裁线正好压在行边界 */
  .md .tw.foldable{--fold-line:30px;--fold-lines:5}   /* 表格：12.5px 字 + 上下各 5px padding */
  .md .tw.foldable:not(.fold-open) table{overflow:hidden}   /* 裁切态由外层裁，内层不要再出滚动条 */
  .md blockquote.foldable{--fold-line:21.6px;line-height:1.6}
  .tool-card pre.foldable{--fold-line:18.6px;position:relative}  /* pre-wrap 自动折行，行高干净；角标定位在 pre 内 */
  /* 表格折外层 .tw 包装（md() 生成），不折 <table> 自身：table 是 display:block + overflow:auto，
     限高后它能自己滚出被折的行，改 display 又会丢掉横向滚动 —— 外层裁最干净。
     裁切态一律 overflow:hidden：既不能留滚动条（否则能滚出被折的内容），也不能被
     .md pre / .tool-card pre 自己的 overflow:auto 翻盘 —— 所以下面这条写两遍提特异性。 */
  .foldable.foldable:not(.fold-open){overflow:hidden}
  .foldable.foldable.fold-open{max-height:420px;overflow:auto}
  .foldable.fold{cursor:pointer}
  .foldable.fold::after{content:"⋯ 点击展开全文";position:absolute;right:10px;bottom:5px;
    font:10.5px/1.4 system-ui,sans-serif;color:var(--accent2);background:var(--code);
    border:1px solid var(--border);border-radius:20px;padding:1px 8px;
    pointer-events:none;opacity:.92}
  .foldable.fold.fold-open::after{content:"⋯ 点击收起"}
  /* 会话切换提示条 */
  .sess-banner{max-width:860px;margin:0 auto 14px;padding:8px 12px;border:1px dashed var(--accent);
    border-radius:10px;color:var(--accent2);font-size:12px;background:rgba(224,120,86,.06)}
  .sess-banner.cut{border-color:var(--warn);color:var(--warn);background:rgba(234,179,8,.08)}
  .empty{color:var(--muted);font-size:12.5px;padding:8px 2px}

  /* 输入区 */
  footer{padding:12px 22px 16px;background:transparent}
  .composer{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;display:flex;align-items:flex-end;gap:10px;padding:10px 12px}
  textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);resize:none;
    font:14px/1.5 inherit}
  #sendBtn{background:var(--accent);border:none;color:#fff;border-radius:10px;width:38px;height:38px;
    font-size:16px;cursor:pointer;flex-shrink:0;transition:opacity .15s,background .15s}
  #sendBtn:hover{background:var(--accent2)}
  #sendBtn.running{background:var(--err)}
  #sendBtn.running:hover{background:#e05a5a}
  .hint{max-width:860px;margin:8px auto 0;font-size:11px;color:var(--muted)}

  /* 快捷指令 chips */
  .chips{max-width:860px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;
    font-size:11.5px;padding:3px 11px;cursor:pointer;transition:color .15s,border-color .15s}
  .chip:hover{color:var(--text);border-color:var(--accent)}

  /* 模态框 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:620px;width:92%;
    max-height:80vh;display:flex;flex-direction:column}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px}
  .modal .mb{padding:14px 18px;overflow:auto}
  .modal .mb .why{color:var(--warn);font-size:12px;margin-bottom:8px}
  .modal .mb pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px;
    overflow:auto;white-space:pre-wrap;word-break:break-word;font:12.5px monospace;margin:0}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .modal button{border-radius:9px;padding:8px 18px;border:1px solid var(--border);cursor:pointer;font-size:13px}
  #rejectBtn{background:transparent;color:var(--muted)}
  #approveBtn{background:var(--accent);color:#fff;border-color:transparent}

  .empty-state{max-width:860px;margin:40px auto;color:var(--muted);text-align:center}
  .empty-state .big{font-size:15px;color:var(--text);margin-bottom:6px}

  /* 运行中指示：左栏会话项 + 顶部状态条（让「真在跑」看得见） */
  .sess .run-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--ok,#3fb950);margin-right:6px;flex:none;
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .sess.running{background:linear-gradient(90deg,rgba(63,185,80,.10),transparent)}
  .sess .run-sub{font-size:11px;color:var(--ok,#3fb950);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #runBar{display:none;align-items:center;gap:10px;padding:7px 14px;margin:0 0 8px;
    background:rgba(63,185,80,.10);border:1px solid rgba(63,185,80,.35);
    border-radius:10px;font-size:12.5px;color:var(--text)}
  #runBar.show{display:flex}
  #runBar .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--muted)}
  #runBar .el{color:var(--muted);font-variant-numeric:tabular-nums}
  #runBar button{border-radius:8px;padding:4px 12px;border:1px solid var(--border);
    background:transparent;color:var(--err);cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="bl">
        <div class="logo">S</div>
        <div style="min-width:0">
          <div class="t1">TraitPilot</div>
          <div class="t2" id="proj">…</div>
        </div>
      </div>
      <button class="icon-btn" id="skillsBtn" title="查看可用 Skills">🧩</button>
    </div>
    <div class="skill-head">
      <span>对话</span>
      <button class="mini" id="reloadSessBtn" title="刷新历史会话列表">↻ 刷新</button>
    </div>
    <div id="sessionList"><div class="empty">加载中…</div></div>
  </aside>

  <main>
    <header>
      <div class="hd">
        <span class="badge"><span id="connDot"></span> <span id="connTxt">连接</span></span>
        <span class="badge" id="modelBadge">—</span>
        <select id="modelSel" title="模型"></select>
        <select id="permSel" title="权限">
          <option value="auto">权限：危险命令询问</option>
          <option value="ask">权限：每条命令询问</option>
        </select>
        <span class="badge" id="usageBadge" title="本轮用量（M1a）">tokens 0</span>
      </div>
      <div class="spacer"></div>
      <button class="ghost" id="stopBtn" style="display:none;color:var(--err);border-color:rgba(248,113,113,.5)">停止</button>
      <button class="ghost" id="exportBtn">导出对话</button>
      <button class="ghost" id="clearBtn">清空对话</button>
      <button class="ghost" id="newBtn">新建会话</button>
    </header>

    <!-- 运行状态条：切到别的会话时，仍能看见原会话在跑什么（点击可跳回） -->
    <div id="runBar"></div>
    <div id="chat"></div>

    <footer>
      <div class="chips" id="chips"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入任务，如：用 gwas-pipeline 跑 ET277 关联分析…  (Enter 发送，Shift+Enter 换行)"></textarea>
        <button id="sendBtn" title="发送"><span id="sendIconIdle">➤</span><span id="sendIconRun" style="display:none">■</span></button>
      </div>
      <div class="hint" id="hint"></div>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div id="ctxMenu"></div>
<aside class="drawer" id="skillDrawer">
  <div class="dh">
    <span>可用 SKILLS <span class="t2" id="skCount" style="font-weight:400"></span></span>
    <button class="icon-btn" id="drawerClose" title="关闭">✕</button>
  </div>
  <div id="skillList"><div class="empty">加载中…</div></div>
</aside>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh">⚠️ 需要你批准执行命令</div>
    <div class="mb">
      <div class="why" id="why">该命令触发权限确认</div>
      <div class="why" id="confirmFrom"></div>
      <pre id="cmdText"></pre>
    </div>
    <div class="mf">
      <button id="rejectBtn">拒绝</button>
      <button id="approveBtn">允许执行</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
// 当前会话 id 可运行时切换（点击历史对话 → 基于该会话继续问答）
let SID = (localStorage.sid && sessionStorage.sid===localStorage.sid)
  ? localStorage.sid : (localStorage.sid = crypto.randomUUID().slice(0,12));
sessionStorage.sid = localStorage.sid;

const ICONS = {Skill:"📘",Bash:"🖥️",Read:"📄",Write:"✏️",Edit:"🔧",Glob:"🗂️",Grep:"🔍",TaskOutput:"⏱️",Search:"🔎",RepoMap:"🗺️",TodoWrite:"✅"};
/* runs：每个会话的运行态（sid → {running, run, controller, state, elapsed, progress, ...}）。
   改造前这里是**一个**全局 state.busy，导致「一个会话在跑 = 整个界面锁死」。
   现在按会话分别记录：切到别的会话照样能发消息、能新建，原会话的流在后台继续读。 */
const runs = new Map();
/* 左栏高亮 / 当前正在查看的会话 id。必须与 runs 一起声明在文件前部：
   setRun() 会读它来决定要不要同步 state.busy 镜像，声明晚于调用点会踩 TDZ。 */
let activeViewId=SID;
/* 当前正被查看的会话是否在跑（保留 state.busy 语义：E2E 与外部脚本依赖它）。 */
const state = {busy:false, model:"", permission:"auto", pendingConfirm:null, controller:null};

/* ---------------- 每会话运行态 ---------------- */
function getRun(sid){ return runs.get(sid) || {}; }
function isRunning(sid){ return !!getRun(sid).running; }
function setRun(sid, patch){
  const cur = runs.get(sid) || {};
  runs.set(sid, Object.assign(cur, patch));
  if(sid===activeViewId) syncBusyToView();
  refreshRunBar();
  return runs.get(sid);
}
function markRunning(sid, patch){ return setRun(sid, patch); }
/* state.busy 现在只是「当前查看会话在跑」的**派生镜像**（E2E/外部脚本读它）。
   改的是镜像，不是事实来源 —— 事实来源是 runs 表。 */
function syncBusyToView(){ setBusy(isRunning(activeViewId)); }
function noteActivity(sid, ev){
  const r = getRun(sid);
  if(ev.type==="tool_start"){
    setRun(sid,{progress:{phase:"tool", tool:ev.name, hint:toolHint(ev)},
                lastEventAt:Date.now()});
  }else if(ev.type==="tool_end"){
    setRun(sid,{progress:{phase:"model", tool:null, hint:""}, lastEventAt:Date.now()});
  }else{
    if(!r.lastEventAt) setRun(sid,{lastEventAt:Date.now()});
  }
  if(sid===activeViewId) refreshRunBar();
}
function toolHint(ev){
  try{
    const d = typeof ev.input==="string" ? JSON.parse(ev.input||"{}") : (ev.input||{});
    return String(d.command||d.file_path||d.pattern||d.skill||"").replace(/\s+/g," ").slice(0,100);
  }catch(e){ return ""; }
}
/* 后端进度快照里 progress.tool 是**对象** {id,name,started_at}（见 runstate.py），
   前端早先直接把它当字符串拼进模板 → 页面上显示「执行 [object Object]」。
   统一走这个取值器：对象取 .name，字符串原样用，缺了给空。 */
function toolLabel(p){
  const t = p && p.tool;
  if(!t) return "";
  return typeof t === "string" ? t : String(t.name||"");
}
function applyRunSnapshot(sid, snap, truncated){
  markRunning(sid,{running:!!snap.running, state:snap.state, run:snap.run,
                   elapsed:snap.elapsed, progress:snap.progress,
                   pendingConfirm:snap.pending_confirm, prefix:snap.prefix,
                   lastSeq:snap.last_seq});
  refreshRunBar();
}

/* ---------------- 窗格暂存：切走时原样保留，切回来原样搬回 ----------------
   用户报的第二个问题就是「切到别的对话，原来那条流就没了」。只把流放后台还不够：
   真正让「切回来像什么都没发生」成立的是把**窗格 DOM 本身**存下来。
   存的是 Fragment（脱离文档但节点还活着），里面的折叠状态、展开的工具卡、已渲染的
   正文都保持原样；切回来时直接搬回 #chat。

   为什么切走时**主动断开**这条流：后端把断开只当退订，Run 照跑、事件进日志。
   若让旧流继续消费，切回来又按游标补一遍，同一条事件会被画两次。
   所以任一时刻只有一个消费者：切走=断，切回=从离开时的 seq 续订。
   离开期间的事件不会丢 —— 它们在后端的追加式日志里等着回放。 */
const panes = new Map();          // sid → {frag, cursor, run, curAssist, curFlow, curTextBox, curThinkEl, ts}

function stashPane(sid){
  if(sid==null) return;
  if(!chatEl.childNodes.length) return;      // 空窗格不必占位置
  // 先把挂起的节流渲染落定（正文每 200ms 才重渲染一次），否则存下来的是半截内容
  if(sid===activeViewId){ try{ flushRender(); }catch(e){} }
  const frag=document.createDocumentFragment();
  while(chatEl.firstChild) frag.appendChild(chatEl.firstChild);
  // 游标必须连**轮次 id** 一起记：每轮是新的 Run，seq 从 1 重新开始，
  // 只存数字的话，下一轮会拿着上一轮的大游标去续订 → 新轮开头的事件被静默跳过。
  const rt=getRun(sid);
  panes.set(sid, {frag:frag, cursor: rt.lastSeq||0, run: rt.run||null,
                  curAssist:curAssist, curFlow:curFlow, curTextBox:curTextBox,
                  curThinkEl:curThinkEl, ts:Date.now()});
  // 流式指针随窗格一起封存；当前上下文清空，避免后台事件写进不属于它的节点
  curAssist=curFlow=curTextBox=curThinkEl=null;
  if(curThinking){ curThinking=null; curThinkingBuf=""; }
  // 断开这条流（只退订，不取消任务）。切回来时按 cursor 续订回放。
  // detached 标记：这是「切走」，不是「停止」—— send() 的 AbortError 分支靠它区分，
  // 否则切走会弹「已请求停止本轮」，那是撒谎。
  const ctl=getRun(sid).controller;
  setRun(sid,{detached:true, streaming:false, controller:null});
  if(ctl){ try{ ctl.abort(); }catch(e){} }
  refreshRunBar();
}

/* 把暂存的窗格搬回来。命中则返回 true（调用方就不该再 replay/rebuild）。
   游标随窗格一起恢复，调用方用它做 attach(after=...) 补离开期间的事件，不重不漏。
   若暂存窗格属于**上一轮**（run id 不同），则它不该被续订 —— 续订是「补这一轮」，
   拿上一轮的游标会跳过新一轮开头。这种情况下当作过期处理，交给磁盘重建。 */
function restorePane(sid, curRunId){
  const p=panes.get(sid);
  if(!p) return false;
  panes.delete(sid);
  // 过期不搬（离开太久，磁盘历史更权威），也顺手释放 Fragment
  if(Date.now()-p.ts > 30*60*1000) return false;
  // 换轮了：窗格上的「本轮」内容与新的 run 对不上，不续订
  if(curRunId!=null && p.run!=null && p.run!==curRunId) return false;
  chatEl.innerHTML="";
  chatEl.appendChild(p.frag);
  curAssist=p.curAssist; curFlow=p.curFlow; curTextBox=p.curTextBox; curThinkEl=p.curThinkEl;
  setRun(sid,{paneCursor: p.cursor, paneRun: p.run, lastSeq: p.cursor});
  return true;
}
/* 该窗格已经画到哪里 —— attach 时用它做 after，避免重放已画内容（会翻倍）。
   只在「窗格所属轮次 == 当前轮次」时才返回游标；换轮了就不能拿旧游标去续订。 */
function paneAfter(sid, curRunId){
  const rt=getRun(sid);
  if(rt.paneCursor==null) return null;
  if(curRunId!=null && rt.paneRun!=null && rt.paneRun!==curRunId) return null;
  return rt.paneCursor;
}
/* 事件日志被后端截断（离开太久，旧事件已被淘汰）→ 暂存的窗格不再是真相，
   丢掉它，改由快照重建。这条分支保证「截断」不会静默地少画一段。 */
function dropPane(sid){
  if(panes.has(sid)) panes.delete(sid);
  setRun(sid,{paneCursor:null, paneRun:null});
}

/* 切回一个正在跑的会话：把「这一轮已经开始的部分」画出来（真在跑的证据）。
   内容来自后端 Run 的快照（partial_text / progress），不是凭空猜的。
   ⚠️ 只在**没有暂存窗格**时用（页面刷新/首次附着）。同一轮内切走再切回走 restorePane：
   那条路径把原来的 DOM 原样搬回来再从离开时的游标续播，两者不可叠加，否则内容翻倍。 */
function rebuildLiveTurn(sid, snap){
  const showable = snap.prefix!=null ? snap.prefix : null;
  const d=document.createElement("div"); d.className="msg user";
  d.innerHTML=`<div class="msg-role">你</div><div class="bubble">${escapeHtml(snap.prompt||"")}</div>`;
  chatEl.appendChild(d);
  addAssistMsg();
  const txt=snap.partial_text||"";
  if(txt){
    clearThinking();
    curTextBox=document.createElement("div");
    curTextBox.className="md"; curTextBox._buf=txt; curTextBox.innerHTML=md(txt);
    curFlow.appendChild(curTextBox); fitFolds(curTextBox);
  }
  const p=snap.progress||{};
  const tl=toolLabel(p);
  if(tl){
    const el=document.createElement("div"); el.className="thinking-live";
    el.innerHTML=`<span class="dot"></span>正在执行 ${escapeHtml(tl)}`
      + (p.hint?` · ${escapeHtml(p.hint)}`:"") + `…`;
    curFlow.appendChild(el);
  }
  if(!txt && !tl) return;      // 什么都没产出时保留「思考中…」占位
  scrollBottom();
}

const CHIPS = [
  ["列出技能", "列出当前项目可用的全部 skill，并简述每个的用途。"],
  ["GWAS 流程", "用 gwas-pipeline skill 说明标准流程，先不要真正跑数据。"],
  ["WGS 流程", "用 wgs-expressive-pipeline skill 说明标准流程与各阶段产物，先不要真正跑数据。"],
  ["表型", "列出 phenotype-extract 提供哪些表型，并说明如何提取 IMF。"],
];

/* ---------------- 初始化 ---------------- */
(async function init(){
  try{
    const cfg = await (await fetch("/api/config")).json();
    state.model = cfg.model;
    $("#modelBadge").textContent = cfg.model;
    $("#proj").textContent = "project · " + cfg.project;
    $("#modelSel").innerHTML = cfg.models.map(m=>`<option value="${m}">${m}</option>`).join("");
    $("#modelSel").value = cfg.model;
    $("#permSel").value = cfg.permission;
    $("#hint").textContent = `API ${cfg.base_url}`;
    $("#connDot").classList.add("on"); $("#connTxt").textContent = "已连接";
    // 先加载历史（会主动高亮「当前会话」，修复默认高亮第一项的问题）
    await renderSessions();
  }catch(e){ $("#connTxt").textContent = "连接失败"; }
  renderChips();
  try{ renderSkills(await (await fetch("/api/skills")).json()); }catch(e){}
})();

function renderChips(){
  $("#chips").innerHTML = CHIPS.map(([label,text],i)=>
    `<span class="chip" data-i="${i}" title="${escapeHtml(text)}">${escapeHtml(label)}</span>`).join("");
  document.querySelectorAll("#chips .chip").forEach(el=>{
    el.addEventListener("click", ()=>{
      // chips 只是往输入框预填文字，与「有没有会话在跑」无关（输入框本身已不再禁用）
      $("#input").value = CHIPS[+el.dataset.i][1];
      autosize(); $("#input").focus();
    });
  });
}

function renderSkills(skills){
  $("#skCount").textContent = skills.length + " 个";
  $("#skillList").innerHTML = skills.map(s=>`
    <div class="skill" data-name="${s.name}" title="${escapeHtml(s.description)}">
      <div class="nm">${s.name}${s.model_invocable?'<span class="inv y">可自动调</span>':""}
        ${s.allowed_tools.includes("Bash")?'<span class="inv">bash</span>':""}</div>
      <div class="dsc">${escapeHtml(s.description)}</div>
      ${s.allowed_tools.length?`<div class="tools">tools: ${s.allowed_tools.join(", ")}</div>`:""}
      <div class="go">↳ 点此预填「加载该 skill」指令</div>
    </div>`).join("");
  document.querySelectorAll("#skillList .skill").forEach(el=>{
    el.addEventListener("click", ()=>{
      const name = el.dataset.name;
      $("#input").value = `用 Skill(${name}) 加载「${name}」并按它的方法执行。`;
      autosize(); $("#input").focus(); closeDrawer();
    });
  });
}

/* ---------------- 侧栏：对话 / 历史会话 ---------------- */
let curSessionMeta={};
const previewCache={};               // 左栏预览缓存：{sid: {mtime, text}}

async function renderSessions(){
  try{
    const [active, archived] = await Promise.all([
      (await fetch("/api/sessions")).json(),
      (await fetch("/api/sessions?archived=1")).json(),
    ]);
    // 左栏标题=该会话里用户问的第一句话；副行=最近一次提问。都按 id+mtime 缓存，
    // 避免每次 renderSessions（切会话/收尾都会调）都重拉全部会话详情。
    const all = [...active, ...archived].filter(s=>s.id!==SID);
    await Promise.all(all.map(async s=>{
      const hit = previewCache[s.id];
      if(hit && hit.mtime===s.mtime){ s._title=hit.title; s._preview=hit.text; return; }
      let title="", text="";
      try{
        const d = await (await fetch("/api/session/"+encodeURIComponent(s.id))).json();
        const ms = d.messages||[];
        title = firstUserTitle(ms);
        const lastUser = [...ms].reverse().find(m=>m.role==="user" &&
          (m.blocks||[]).some(b=>b.type==="text" && b.text));
        text = lastUser
          ? lastUser.blocks.filter(b=>b.type==="text").map(b=>b.text).join(" ")
              .replace(/\s+/g," ").trim().slice(0,60)
          : "";
      }catch(e){}
      previewCache[s.id]={mtime:s.mtime, title:title, text:text};
      s._title=title; s._preview=text;
    }));
    // 后端在 /api/sessions 里带了运行摘要 → 把它们并进 runs 表，
    // 这样左栏「谁在跑」是第一手的，不依赖用户点进去才发现。
    for(const s of [...active, ...archived]){
      if(s.running){
        const cur=getRun(s.id);
        setRun(s.id,{running:true, state:s.state, run:s.run,
                     elapsed: s.elapsed!=null ? s.elapsed : cur.elapsed,
                     progress: s.progress || cur.progress,
                     startedAt: cur.startedAt || (s.elapsed!=null ? Date.now()-s.elapsed*1000 : undefined)});
      }else if(getRun(s.id).running && s.state){
        setRun(s.id,{running:false, state:s.state});
      }
    }
    const el=$("#sessionList");
    const now = active.find(s=>s.id===SID);
    let html="";
    // 当前会话置顶（即便尚未落盘也显示）：标题取本会话第一句话，
    // 还没有第一句话就用「新会话」；预览显示最近一次提问。
    const curTitle = curSessionMeta.title || "新会话";
    const curRun = getRun(SID);
    html += sessItem({id:SID, mtime: now?now.mtime:Date.now()/1000, size: now?now.size:0,
                      _cur:true, _title:curTitle, _preview:curSessionMeta.preview||"",
                      running: !!curRun.running, progress: curRun.progress});
    for(const s of active){
      if(s.id===SID) continue;
      html += sessItem(s);
    }
    if(archived.length){
      html += `<div class="sess-group" id="archToggle">📦 已归档（${archived.length}） <span class="caret">▸</span></div>`;
      html += `<div id="archList" style="display:none">${archived.map(sessItem).join("")}</div>`;
    }
    el.innerHTML=html;
    const at=$("#archToggle");
    if(at) at.addEventListener("click",()=>{
      const l=$("#archList"); const open=l.style.display!=="none";
      l.style.display=open?"none":""; at.querySelector(".caret").textContent=open?"▸":"▾";
    });
    el.querySelectorAll(".sess").forEach(node=>{
      node.addEventListener("click",()=>selectSession(node.dataset.id));
      node.addEventListener("contextmenu", e=>{ e.preventDefault(); showCtxMenu(e, node); });
    });
    syncBusyToView();          // 左栏刷新后，「当前会话」的按钮形态跟着它自己的运行态走
    refreshRunBar();
  }catch(e){
    $("#sessionList").innerHTML=`<div class="empty">无法加载会话列表</div>`;
  }
}

/* 选中某个会话：把它设为「当前会话」，右侧基于它继续问答（不新建、不清空）。
   若该会话正在跑，切过来就**重新附着**它的流（后端 Run 仍在，事件可回放）。 */
async function selectSession(id, force){
  if(id===SID && activeViewId===id && !force){ renderSessions(); return; }
  const prev=activeViewId;
  // ① 先把当前窗格**原样存起来**（不是丢弃）。后台流事件继续往这个 Fragment 里写，
  //    所以切回来时看到的是那一轮真实的样子，而不是事后重建的近似品。
  if(prev!=null && prev!==id) stashPane(prev);
  setCurrent(id);            // 唯一写入口：顺带把 state.busy 镜像重算到新会话
  curSessionMeta = {};
  // 左栏标题就是「本会话第一句话」：切过来的同时把它记下，切换后标题立刻跟上
  const pc = previewCache[id];
  if(pc) curSessionMeta.title = pc.title;
  // ② 先问后端：这个会话是不是正在跑？
  let runInfo=null;
  try{ runInfo = await (await fetch(`/api/session/${encodeURIComponent(id)}/run`)).json(); }
  catch(e){}
  const running = !!(runInfo && runInfo.running);
  if(running){
    markRunning(id,{running:true, state:runInfo.state, run:runInfo.run,
                    elapsed:runInfo.elapsed, progress:runInfo.progress});
  }else{
    markRunning(id,{running:false, state:(runInfo&&runInfo.state)||null});
  }
  // ③ 如果这个会话有暂存的窗格 → 原样搬回，再从离开时的游标续播（不重放、不重建）
  const curRunId = running && runInfo ? runInfo.run : null;
  const restored = restorePane(id, curRunId);
  if(restored){
    // 离开期间这一轮可能已经跑完（暂存时主动断了流，末尾几帧没进来）。
    // 判据：轮次已终态，但窗格游标 < 该轮最后事件号 → 窗格是残缺的，退回磁盘重建。
    const lastSeq = runInfo && runInfo.last_seq!=null ? runInfo.last_seq : null;
    const cur = getRun(id);
    const sameRun = cur.paneRun && runInfo && cur.paneRun===runInfo.run;
    const stale = !running && lastSeq!=null && sameRun && (cur.paneCursor||0) < lastSeq;
    if(!stale){
      if(running) attach(id, paneAfter(id, curRunId));  // after=离开时的 seq → 只补新事件
      renderSessions();
      scrollBottom();
      $("#input").focus();
      syncBusyToView();
      return;
    }
    dropPane(id);                              // 残缺 → 当作没暂存，走下面的磁盘重建
  }
  // ④ 没有暂存窗格（首次切过来 / 页面刚刷新）：按磁盘 + 快照重建
  let data=null, netErr=false;
  try{ data = await (await fetch("/api/session/"+encodeURIComponent(id))).json(); }
  catch(e){ netErr = true; }
  chatEl.innerHTML=""; curAssist=curFlow=curTextBox=null;
  const emptyState=(big, sub)=>{
    chatEl.innerHTML=`<div class="empty-state"><div class="big">${escapeHtml(big)}</div>${escapeHtml(sub)}</div>`;
  };
  if(netErr || !data || !data.ok){
    if(!running)
      emptyState(netErr?"加载会话失败":"会话不存在或已被删除",
                 netErr?"网络请求出错，请刷新后重试。":"服务端没有这个 id 的记录。");
  }else{
    const msgs=data.messages||[];
    // 标题与预览都取「磁盘上的第一/最后一次提问」，而不是靠调用方缓存传进来
    const title = firstUserTitle(msgs) || previewCache[id]?.title || "";
    if(title) curSessionMeta.title = title;
    if(msgs.length){
      const hdr=document.createElement("div");
      hdr.className="sess-banner";
      hdr.innerHTML=`📂 已切到会话 <b>${escapeHtml(title || id)}</b> · 继续提问会基于这段历史`;
      chatEl.appendChild(hdr);
      replayMessages(msgs, {incompleteFrom: data.resume_count});
    }else if(!running){
      emptyState("该会话没有可显示的内容",
                 "磁盘上只保存了元数据，没有收发出过任何消息。");
    }
    if(data.reason==="no_completed_assistant" && !running){
      notice("该会话还没有任何已完成的助手回复。上方内容按磁盘原样显示；续问会从空历史开始。");
    }else if((data.discarded||0)>0){
      notice(`已按磁盘原样显示全部内容；但续问会从上一个已完成的轮次接续，`
             +`末尾 ${data.discarded} 条未完成内容不会发给模型。`);
    }
  }
  // 运行中的会话：把本轮已在产出的内容画出来 + 重新附着到它的流
  if(running){
    const seat=document.createElement("div"); seat.className="sess-banner";
    seat.innerHTML=`🟢 这个会话正在后台运行（已跑 ${(runInfo.elapsed||0).toFixed?.(0)||0}s）`
      +` · 下面的内容会实时更新`;
    chatEl.appendChild(seat);
    rebuildLiveTurn(id, runInfo);
    attach(id, runInfo.last_seq);        // 从当前游标继续，不重放已画出的部分
  }
  markRunning(id,{streaming: running ? getRun(id).streaming : false});
  renderSessions();
  scrollBottom();
  $("#input").focus();
  syncBusyToView();
}


/* ---------------- 右键菜单：归档 / 删除 ---------------- */
// 不要用全局变量暂存右键目标：document 上的 click 会先跑 hideCtxMenu() 并把目标清空，
// 导致 ctxAction 拿到 null（这正是「点归档/删除没反应」的原因）。改为把目标挂在菜单节点上。
function showCtxMenu(ev, node){
  const id=node.dataset.id, archived=node.dataset.arch==="1", isCur=(id===SID);
  const menu=$("#ctxMenu");
  menu.dataset.target=JSON.stringify({id: id, archived: archived, isCur: isCur,
                                      active: (activeViewId===id)});
  const items=[];
  if(!isCur){
    items.push(archived ? ["unarchive","↩ 取消归档"] : ["archive","📦 归档"]);
  }
  items.push(["delete","🗑 删除"]);
  menu.innerHTML=items.map(([act,label])=>
    `<button class="ctx-item${act==="delete"?" danger":""}" data-act="${act}">${label}</button>`).join("");
  // 键盘/脚本触发 contextmenu 时 clientX/Y 为 0，兜底到一个可见位置
  const px=ev.clientX||10, py=ev.clientY||80;
  menu.style.left=Math.max(0, Math.min(px, window.innerWidth-170))+"px";
  menu.style.top =Math.max(0, Math.min(py, window.innerHeight-130))+"px";
  menu.classList.add("show");
  menu.querySelectorAll(".ctx-item").forEach(b=>{
    // 阻止冒泡，确保 document 的关闭监听不会干扰这次点击
    b.addEventListener("click", ev2=>{ ev2.stopPropagation(); ctxAction(b.dataset.act); });
  });
}
function hideCtxMenu(){ $("#ctxMenu").classList.remove("show"); }

async function ctxAction(act){
  const menu=$("#ctxMenu");
  let t=null;
  try{ t=JSON.parse(menu.dataset.target||"null"); }catch(e){}
  hideCtxMenu();
  if(!t || !t.id) return;
  const {id, archived, isCur}=t;
  if(act==="delete"){
    if(isCur){ alert("这是当前正在使用的会话，请先「新建会话」再删除它。"); return; }
    if(!confirm(`确定永久删除会话「${id}」？此操作不可撤销。`)) return;
    await fetch("/api/session/delete",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:id})});
    if(activeViewId===id) backToCurrent();
  }else if(act==="archive" || act==="unarchive"){
    if(isCur){ alert("当前会话无法归档，请先新建会话。"); return; }
    const toArchive = act==="archive";
    await fetch("/api/session/archive",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:id, archived:toArchive})});
    if(toArchive && activeViewId===id) backToCurrent();
  }
  renderSessions();
}

/* 从消息列表里取「标题」：第一条**有文字**的用户提问（单行、截断）。
   忽略以 / 开头的斜杠命令与工具结果消息。为空表示还没有可用的标题。 */
function firstUserTitle(ms){
  for(const m of (ms||[])){
    if(m.role!=="user") continue;
    const blocks=m.blocks||[];
    if(blocks.length && blocks.every(b=>b.type==="tool_result")) continue;   // 工具结果
    const text=blocks.filter(b=>b.type==="text").map(b=>b.text).join(" ").trim();
    if(!text || text.startsWith("/")) continue;                              // 命令/空
    return text.replace(/\s+/g," ").slice(0,60);
  }
  return "";
}

function sessItem(s){
  const t=new Date((s.mtime||0)*1000);
  const when=t.toLocaleString();
  const kb=Math.max(1,Math.round((s.size||0)/1024));
  const isActive = (s.id===activeViewId);
  const rt = getRun(s.id);
  const running = !!(s.running || rt.running);
  // 标题=用户第一句话（认得出是哪次对话）；没有就退回短 id，再没有才显示加载中
  const title = s._title || "";
  const fallback = "会话 " + String(s.id).slice(0,8);
  const name = title || (s._title===undefined ? "加载中…" : fallback);
  const sub = title && s._preview && s._preview!==title ? s._preview : "";
  const pr = (s.progress || rt.progress);
  const runSub = running
    ? `<div class="run-sub">${toolLabel(pr) ? "▸ 执行 "+escapeHtml(toolLabel(pr)) : "▸ 模型生成中"}`
      + `${pr && pr.hint ? " · "+escapeHtml(String(pr.hint).slice(0,40)) : ""}</div>`
    : "";
  return `<div class="sess${isActive?" active":""}${s.archived?" arch":""}${running?" running":""}" data-id="${s.id}" data-arch="${s.archived?"1":"0"}" title="会话 id：${escapeHtml(s.id)}">
    <div class="r1">${running?'<span class="run-dot"></span>':(s._cur?'<span class="dot"></span>':"")}<span class="nm">${escapeHtml(name)}</span>${s._cur?'<span class="curtl">当前</span>':""}${s.archived?'<span class="curtl">归档</span>':""}</div>
    <div class="t2"><span>${when}</span><span>${kb} KB</span></div>
    ${runSub}${sub?`<div class="dsc">${escapeHtml(sub)}</div>`:""}
  </div>`;
}

/* 把持久化的消息重建为气泡（历史查看用）。
   opts.incompleteFrom：从该下标起是「未完成轮次」（后端 resume_count），前面插一条分隔提示。 */
function replayMessages(msgs, opts){
  const cut = (opts && opts.incompleteFrom!=null) ? opts.incompleteFrom : Infinity;
  let flow=null;
  const list = msgs||[];
  for(let i=0;i<list.length;i++){
    if(i===cut){
      const sep=document.createElement("div");
      sep.className="sess-banner cut";
      sep.innerHTML="⚠️ 以下内容尚未完成（模型未回复或中途中断）——续问时不会发给模型";
      chatEl.appendChild(sep);
    }
    const m=list[i];
    if(m.role==="user"){
      const blocks=m.blocks||[];
      const allResults=blocks.length>0 && blocks.every(b=>b.type==="tool_result");
      if(allResults){
        // 工具结果 → 填进对应的工具卡（同一 assistant 轮次内）
        for(const b of blocks){
          if(b.type!=="tool_result") continue;
          const card=chatEl.querySelector(`.tool-card[data-id="${b.tool_use_id}"]`);
          if(card){
            const st=card.querySelector(".status");
            st.innerHTML=b.is_error?`<span class="st-err">✗ 出错</span>`:`<span class="st-ok">✓ 完成</span>`;
            const res=card.querySelector(".res");
            res.textContent=b.content||"(空)";
            res.style.color=b.is_error?"var(--err)":"";
            if(b.is_error) card.classList.add("open");
            requestAnimationFrame(()=>fitFolds(card));   // 回填后重算「结果」块要不要折
          }
        }
        continue;
      }
      const text=blocks.filter(b=>b.type==="text").map(b=>b.text).join("\n");
      const d=document.createElement("div");
      d.className="msg user";
      d.innerHTML=`<div class="msg-role">你</div><div class="bubble">${escapeHtml(text)}</div>`;
      chatEl.appendChild(d);
      continue;
    }
    // assistant
    const wrap=document.createElement("div");
    wrap.className="msg assist";
    wrap.innerHTML=`<div class="msg-role">TraitPilot</div><div class="bubble"><div class="flow"></div></div>`;
    chatEl.appendChild(wrap);
    flow=wrap.querySelector(".flow");
    for(const b of (m.blocks||[])){
      if(b.type==="thinking" && (b.text||"").trim()){
        flow.appendChild(makeThinkBox(b.text));
      }else if(b.type==="text" && b.text){
        const t=document.createElement("div"); t.className="md"; t.innerHTML=md(b.text);
        flow.appendChild(t);
      }else if(b.type==="tool_use"){
        const card=document.createElement("div");
        card.className="tool-card open"; card.dataset.id=b.id;   // 默认展开，折叠交给内部的 fitFolds
        card.innerHTML=`<div class="hd"><span class="ico">${ICONS[b.name]||"🧰"}</span>
          <span class="nm">${escapeHtml(b.name)}</span>
          <span class="status">…</span></div>
          <div class="body"><div class="lab">调用参数</div><pre>${escapeHtml(safeJson(b.input||{}))}</pre>
          <div class="lab">结果</div><pre class="res">（无记录）</pre></div>`;
        card.querySelector(".hd").addEventListener("click",()=>card.classList.toggle("open"));
        flow.appendChild(card);
      }
    }
    const tail=document.createElement("div");
    tail.className="tail"; tail.textContent="（历史记录）";
    flow.appendChild(tail);
  }
  foldScanSoon();          // 回放完成 → 给超长的参数/结果/代码块/表格挂上折叠
}

/* ---------------- Skills 抽屉 ---------------- */
function openDrawer(){ $("#skillDrawer").classList.add("open"); $("#scrim").classList.add("show"); }
function closeDrawer(){ $("#skillDrawer").classList.remove("open"); $("#scrim").classList.remove("show"); }

/* ---------------- 运行状态条（切走后仍看得见原会话在跑） ---------------- */
function runningSids(){ return [...runs.entries()].filter(([,r])=>r.running).map(([s])=>s); }
function refreshRunBar(){
  const bar=$("#runBar");
  if(!bar) return;
  const others=runningSids().filter(s=>s!==activeViewId);
  const cur=runningSids().includes(activeViewId);
  if(!others.length && !cur){ bar.classList.remove("show"); bar.innerHTML=""; return; }
  const parts=[];
  if(cur){
    const r=getRun(activeViewId), p=r.progress||{};
    const cancelling = r.state==="cancelling";
    const tl = toolLabel(p);
    const what = cancelling ? "正在取消…（正在执行的命令要等它自己返回）"
      : (tl ? `正在执行 ${escapeHtml(tl)}${p.hint?" · "+escapeHtml(p.hint):""}`
            : "模型生成中");
    parts.push(`<span class="dot" style="background:${cancelling?"var(--warn,#facc15)":"var(--ok,#3fb950)"}"></span>`
      + `<b>${cancelling?"本会话取消中":"本会话运行中"}</b> <span class="sp">${what}</span>`
      + `<span class="el">${fmtElapsed(r)}</span>`);
  }
  for(const s of others){
    const r=getRun(s), p=r.progress||{};
    const nm=previewCache[s]?.title || ("会话 "+String(s).slice(0,8));
    const what = toolLabel(p) ? `执行 ${escapeHtml(toolLabel(p))}` : "模型生成中";
    parts.push(`<span class="dot" style="background:var(--ok,#3fb950)"></span>`
      + `<a href="#" data-goto="${escapeHtml(s)}" style="color:inherit">`
      + `${escapeHtml(nm)}</a> <span class="sp">${what}</span>`
      + `<span class="el">${fmtElapsed(r)}</span>`);
  }
  bar.innerHTML = parts.join(`<span style="color:var(--border)">│</span>`);
  bar.classList.add("show");
  bar.querySelectorAll("a[data-goto]").forEach(a=>{
    a.addEventListener("click", ev=>{ ev.preventDefault(); selectSession(a.dataset.goto); });
  });
}
function fmtElapsed(r){
  if(!r.startedAt) { r.startedAt = Date.now() - (r.elapsed||0)*1000; }
  const s=Math.max(0, Math.round((Date.now()-r.startedAt)/1000));
  return (s>=60 ? `${Math.floor(s/60)}m${String(s%60).padStart(2,"0")}s` : `${s}s`);
}
// 秒表：只要有会话在跑就每秒刷新一次
setInterval(()=>{ if(runningSids().length) refreshRunBar(); }, 1000);

/* ---------------- 会话 ---------------- */
let curAssist=null, curFlow=null, curTextBox=null, curThinkEl=null;
let curThinking=null, curThinkingBuf="";
let curRenderTimer=null, thinkTimer=null;
/* 流式事件该不该画在当前窗格：只有「事件所属会话 == 正在查看的会话」才画。
   改造前这里看的是 viewingHistory（切走=只读），导致切回来后原会话的流已经断了；
   现在切走的会话会「断流 + 暂存窗格」，切回来按游标续订，内容不重不漏。 */
function liveSid(){ return activeViewId; }
function shouldRender(evSid){ return evSid===liveSid(); }
/* 兼容位：旧代码与 tests/ui_fold_e2e.py 会赋值它。新架构里「切走」不再等于「只读回放」
   —— 流在后台照读 —— 所以它恒为 false。保留声明只为让外部脚本赋值不报错，
   真正的渲染闸门是上面的 shouldRender()。 */
let viewingHistory=false;
const RENDER_MAX = 120000;          // 流式渲染的源文上限（超出只渲染尾部窗口）
const FINAL_MAX  = 500000;          // 最终整段渲染上限
const chatEl = $("#chat");

/* 只读的「思考过程」折叠块：默认 3 行，点击展开/收起 */function makeThinkBox(text, open=false){
  const box=document.createElement("div");
  box.className="think-box"+(open?" open":"");
  const t=(text||"").trim()||"（无思考内容）";
  box.innerHTML=`<div class="thd"><span class="lb">🧠 思考过程</span><span class="tip"></span></div>`
    +`<div class="tclamp">${escapeHtml(t)}</div>`;
  box.querySelector(".thd").addEventListener("click",()=>box.classList.toggle("open"));
  return box;
}

/* 折叠的「实测」要等元素真正上屏（display:none / 还没插进 DOM 时 scrollHeight 都是 0） */
function foldScanSoon(){ requestAnimationFrame(()=>fitFolds()); }

/* 流式思考：先显示一行「思考中…」，收完后原地替换成可折叠块（不占大段空间） */
function ensureThinkLive(){
  if(curThinking) return;
  curThinkingBuf="";
  const el=document.createElement("div");
  el.className="thinking-live";
  el.innerHTML=`<span class="dot"></span>思考中…`;
  curFlow.appendChild(el);
  curThinking=el;
}
function thinkDelta(d){
  clearThinking();                 // 有思考 → 移走「思考中…（模型计算中）」占位
  if(viewingHistory) return;
  ensureThinkLive();
  curThinkingBuf+=d;
  if(thinkTimer) clearTimeout(thinkTimer);
  thinkTimer=setTimeout(()=>finalizeThink(),350);   // 一段思考写完就变成折叠块
  scrollBottom();
}
function finalizeThink(){
  if(thinkTimer){ clearTimeout(thinkTimer); thinkTimer=null; }
  const el=curThinking;                          // 先取节点：下一行会把 curThinking 置空
  if(!el) return;
  const txt=curThinkingBuf; curThinking=null; curThinkingBuf="";
  if(!txt.trim() || !el.isConnected) return;
  el.replaceWith(makeThinkBox(txt));             // 原地替换为可折叠块
}

function addUserMsg(text){
  const d=document.createElement("div");
  d.className="msg user";
  d.innerHTML=`<div class="msg-role">你</div><div class="bubble">${escapeHtml(text)}</div>`;
  chatEl.appendChild(d); scrollBottom();
}
function addAssistMsg(){
  curAssist=document.createElement("div");
  curAssist.className="msg assist";
  curAssist.innerHTML=`<div class="msg-role">TraitPilot</div><div class="bubble"><div class="flow"></div></div>`;
  chatEl.appendChild(curAssist);
  curFlow=curAssist.querySelector(".flow"); curTextBox=null;
  curThinkEl=document.createElement("div");
  curThinkEl.className="thinking";
  curThinkEl.innerHTML=`<span class="dot"></span>思考中…（模型计算中，首次输出可能需 10–60 秒）`;
  curFlow.appendChild(curThinkEl);
  scrollBottom();
}
function addErrorMsg(text){
  const d=document.createElement("div");
  d.className="msg assist";
  d.innerHTML=`<div class="msg-role">TraitPilot</div><div class="bubble"><div class="md"><p style="color:var(--err)">${escapeHtml(text)}</p></div></div>`;
  chatEl.appendChild(d); scrollBottom();
}

function clearThinking(){ if(curThinkEl){ curThinkEl.remove(); curThinkEl=null; } }

function notice(text){
  if(!text) return;
  const d=document.createElement("div");
  d.className="msg assist";
  d.innerHTML=`<div class="bubble"><div class="md"><p style="color:var(--warn)">ℹ️ ${escapeHtml(text)}</p></div></div>`;
  chatEl.appendChild(d); scrollBottom();
}

/* 增量节流渲染：不每 token 全量重渲染，集中于 ~200ms 间隔；源文超限只渲染尾部窗口 */
function scheduleRender(){
  if(curRenderTimer) return;
  curRenderTimer=setTimeout(()=>{ curRenderTimer=null; doRender(); }, 200);
}
function flushRender(){
  if(curRenderTimer){ clearTimeout(curRenderTimer); curRenderTimer=null; doRender(); }
}
function doRender(){
  if(!curTextBox) return;
  // 流式中：整段 innerHTML 重建，字号/缩进都会变，折叠状态要重新量（重建会掀掉 max-height）
  if(curTextBox._fold) applyFold(curTextBox);
  let buf=curTextBox._buf||"";
  if(buf.length>RENDER_MAX) buf="…[内容过长，流式预览已截断]\n\n"+buf.slice(-RENDER_MAX);
  try{
    curTextBox.innerHTML=md(buf);
    throttleScroll();
  }catch(e){
    // 渲染失败只降级显示纯文本，不让页面崩掉
    console.error("render 失败，降级为纯文本：", e);
    curTextBox.textContent = buf;
  }
}

function textDelta(d){
  clearThinking();
  if(viewingHistory) return;
  finalizeThink();                       // 正文开始 → 把进行中的思考收成折叠块
  if(!curTextBox){ curTextBox=document.createElement("div"); curTextBox.className="md"; curFlow.appendChild(curTextBox); }
  curTextBox._buf=(curTextBox._buf||"")+d;
  scheduleRender();
}
function toolStart(ev){
  clearThinking();
  if(viewingHistory) return;
  finalizeThink();
  if(curTextBox) flushRender();          // 渲染挂起缓冲后再插入工具卡
  curTextBox=null;
  if(!curFlow) return;
  const card=document.createElement("div");
  card.className="tool-card open"; card.dataset.id=ev.id;
  let inp = safeJson(ev.input||{});
  card.innerHTML=`
    <div class="hd"><span class="ico">${ICONS[ev.name]||"🧰"}</span>
      <span class="nm">${ev.name}</span>
      <span class="status st-run"><span class="tc-spin"></span>运行中</span></div>
    <div class="body">
      <div class="lab">调用参数</div><pre>${escapeHtml(inp)}</pre>
      <div class="lab">结果</div><pre class="res">（等待返回…）</pre>
    </div>`;
  const hd=card.querySelector(".hd");
  hd.addEventListener("click",()=>card.classList.toggle("open"));
  curFlow.appendChild(card);
  scrollBottom();
}
function toolEnd(ev){
  const card=curFlow?curFlow.querySelector(`.tool-card[data-id="${ev.id}"]`):null;
  if(!card) return;
  const st=card.querySelector(".status");
  st.innerHTML = ev.is_error ? `<span class="st-err">✗ 出错</span>` : `<span class="st-ok">✓ 完成</span>`;
  const res=card.querySelector(".res");
  res.textContent = (ev.result||"(空)");
  res.style.color = ev.is_error ? "var(--err)" : "";
  if(ev.is_error) card.classList.add("open");
  card.classList.add("open");        // 工具卡默认展开，长内容由内部的折叠控制（见 fitFolds）
  requestAnimationFrame(()=>fitFolds());   // 结果回填后重新量「结果」块要不要折
  scrollBottom();
}

function finalize(ev){
  clearThinking(); finalizeThink();
  flushRender();
  if(viewingHistory) return;
  const full=(ev.final||"");
  const finalText = full.length>FINAL_MAX ? full.slice(0,FINAL_MAX)+"\n…[最终内容过长，已截断]" : full;
  curTextBox=curTextBox||document.createElement("div");
  if(!curTextBox.isConnected){ curTextBox.className="md"; curFlow.appendChild(curTextBox); }
  curTextBox._buf=finalText; curTextBox.innerHTML=md(finalText);   // 全文只在此处渲染一次
  fitFolds(curTextBox);                                            // 收尾：折叠超长的代码块/表格/引用
  const tail=document.createElement("div");
  tail.className="tail";
  const stopTxt = ev.stop_reason && ev.stop_reason!=="end_turn" ? ` · 终止=${ev.stop_reason}` : "";
  if(ev.usage) setUsage(ev.usage);
  tail.textContent = `完成 · ${ev.messages||""} 条上下文消息` + stopTxt + (ev.active&&ev.active.length?` · 激活 skill: ${ev.active.join(", ")}`:"");
  curFlow.appendChild(tail);
  if(ev.resume_discarded>0){
    notice(`注意：本会话开头有 ${ev.resume_discarded} 条未完成内容未随续问发送给模型`
           +`（可从左侧切回该会话查看完整内容）。`);
  }
  curAssist=null; curFlow=null; curTextBox=null;
  scrollBottom(); renderSessions();
}

function setUsage(u){
  if(!u) return;
  const t=(u.output_tokens!=null?u.output_tokens:0);
  const ms=(u.latency_ms!=null?u.latency_ms:0);
  $("#usageBadge").textContent = `tokens ${t} · ${(ms/1000).toFixed(1)}s · ${u.steps||0} 轮`;
  $("#usageBadge").title = `模型 ${u.model||""} · 输出 token ${t} · 累计延迟 ${ms}ms · 模型轮次 ${u.steps||0}`;
}

async function send(){
  const text=$("#input").value.trim();
  const sid=SID;
  if(!text||isRunning(sid)) return;          // 只看**本会话**是否在跑，不看别的会话
  if(!curSessionMeta.title) curSessionMeta.title = text.replace(/\s+/g," ").slice(0,60);
  markRunning(sid,{running:true,state:"running"});
  addUserMsg(text); $("#input").value=""; autosize();
  addAssistMsg();
  const body={session:sid,message:text,model:state.model,permission:state.permission};
  const ctl=new AbortController();
  setRun(sid,{controller:ctl, detached:false, streaming:true});
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body),signal:ctl.signal});
    if(!res.ok || !res.body){
      const j=await res.json().catch(()=>({}));
      // 409（本会话真在跑）不再是死胡同：直接附着到那一条流上
      if(res.status===409){ attach(sid); return; }
      addErrorMsg(j.error||"请求失败 ("+res.status+")");
      markRunning(sid,{running:false});
      return;
    }
    await consume(res,sid);                   // 流带着 sid 走；切走时只有这一条会断（detached）
  }catch(e){
    if(e && e.name === "AbortError"){
      // 两种 abort 全然不同，必须分开：
      //   切走（detached）→ 只是退订，任务还在跑，什么都不该说；
      //   点「停止」   → 已发 /api/cancel，但 python 杀不掉正在执行的 Bash，
      //                 说「已停止」就是撒谎，如实讲清「要等它自己返回」。
      if(getRun(sid).detached){ cleanupTurn(); return; }
      notice("已请求停止本轮 —— 正在执行的命令要等它自己返回，不会立刻中断。");
      cleanupTurn(); return;
    }
    if(document.hidden) return;
    console.error("[chat] 读取响应流失败：", e);
    const alloc = e instanceof RangeError;
    const tag = `${(e && e.name) || "Error"}: ${(e && e.message) || e}`;
    addErrorMsg(alloc
      ? `响应流分配内存失败（${tag}）。通常是连接被中途截断/损坏所致，请重试或刷新页面。`
      : `连接中断（${tag}）。`);
    cleanupTurn();
  }
  finally{ setRun(sid,{controller:null}); }
}

/* 附着到某会话正在跑的那条流（切回来 / 网络重连 / 409 后转订阅都走这里）。
   非破坏式：后端可以同时服务多个订阅者，且断开不会取消任务。 */
async function attach(sid, after){
  if(isRunning(sid) && getRun(sid).streaming) return;   // 已经在读这条流了
  // 没显式给游标时，用暂存窗格的游标兜底（只补离开期间的新事件，不重放已画的）
  if(after==null) after = paneAfter(sid);
  const q = (after!=null) ? ("?after="+after) : "";
  const ctl=new AbortController();
  markRunning(sid,{running:true, streaming:true, detached:false, controller:ctl});
  try{
    const res=await fetch(`/api/session/${encodeURIComponent(sid)}/stream`+q,
      {headers:{"Accept":"text/event-stream"}, signal:ctl.signal});
    if(!res.ok){ markRunning(sid,{running:false, streaming:false}); return; }
    const ct=res.headers.get("content-type")||"";
    if(ct.includes("application/json")){
      // 该轮已结束：退回磁盘渲染（磁盘才是权威，暂存窗格可以丢了）
      const j=await res.json().catch(()=>({}));
      markRunning(sid,{running:false, streaming:false});
      dropPane(sid);
      if(activeViewId===sid) selectSession(sid, true);
      return;
    }
    await consume(res,sid);
  }catch(e){
    if(!(e && e.name==="AbortError")) console.warn("[attach] 流中断：", e);
  }finally{
    markRunning(sid,{streaming:false, controller:null});
  }
}

async function consume(res,sid){
  const reader=res.body.getReader(); const dec=new TextDecoder();
  let buf="";
  while(true){
    let value;
    try{
      const r=await reader.read();
      if(r.done) break;
      value=r.value;
    }catch(e){
      if(buf.trim()) handleEventSafe(buf,sid);
      throw e;
    }
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n\n"))>=0){ const blk=buf.slice(0,i); buf=buf.slice(i+2); handleEventSafe(blk,sid); }
  }
  if(buf.trim()) handleEventSafe(buf,sid);      // 尾包也要带 sid，否则尾部事件会被画到别的会话里
}

function handleEvent(block, sid){
  const lines=block.split("\n");
  let type="message", data="";
  for(const l of lines){
    if(l.startsWith("event:")) type=l.slice(6).trim();
    else if(l.startsWith("data:")) data+=l.slice(5);
  }
  if(type==="message") return;
  let ev; try{ ev=JSON.parse(data); }catch(e){ return; }
  // 事件按 sid 归属：不画到别处的窗格里，但仍更新该会话的运行态（左栏/状态条要用）
  const rt = sid || SID;
  if(ev.type==="attach"){
    applyRunSnapshot(rt, ev);
    return;
  }
  if(ev.type==="resync"){
    // 事件日志已被后端截断（离开太久，最旧的事件被淘汰）：暂存的窗格不再是真相，
    // 丢掉它并改用快照重建 —— 而不是假装完整、静默地少画一段。
    dropPane(rt);
    applyRunSnapshot(rt, ev, true);
    if(shouldRender(rt)){       // 正在看它 → 立刻按快照重建，别让用户盯着残缺的窗格
      chatEl.innerHTML=""; curAssist=curFlow=curTextBox=curThinkEl=null;
      rebuildLiveTurn(rt, ev);
      setRun(rt,{paneCursor: ev.last_seq, paneRun: ev.run||null});
    }
    return;
  }
  if(ev.type==="end"){
    // 只有**正常完成**的轮次磁盘才是完整的（agent 边跑边落盘）。
    // 取消/出错时尾部内容不在磁盘上，所以那种情况下保留暂存窗格 —— 否则用户切回来
    // 会看不到刚才那段报错输出，只剩一个干净的旧历史。
    if((ev.state||"done")==="done") dropPane(rt);
    markRunning(rt,{running:false, streaming:false, state:ev.state||"done"});
    if(shouldRender(rt)) renderSessions();
    refreshRunBar();
    return;
  }
  noteActivity(rt, ev);
  if(!shouldRender(rt)) return;      // 不在看这个会话 → 只更新状态，不画
  setRun(rt,{lastSeq:Math.max(getRun(rt).lastSeq||0, ev.seq||0)});
  switch(ev.type){
    case "text": textDelta(ev.delta||""); break;
    case "thinking": thinkDelta(ev.delta||""); break;
    case "tool_start": toolStart(ev); break;
    case "tool_end": toolEnd(ev); break;
    case "confirm": showConfirm(ev, rt); break;
    case "notice": notice(ev.message||""); break;
    case "loop_guard": notice(ev.message||""); break;
    case "usage": setUsage(ev); break;
    case "done": finalize(ev); break;
    case "error": addErrorMsg(ev.message||"运行出错"); break;
  }
}
function handleEventSafe(block, sid){
  try{ handleEvent(block, sid); }
  catch(e){
    // 单帧渲染失败不再中断整个连接（此前会白屏报"连接中断"）
    console.warn("event 处理失败，已跳过：", e && e.message);
  }
}

/* ---------------- 确认 ---------------- */
function showConfirm(ev, sid){
  /* sid = **发问方**会话（不一定是当前查看的会话）。
     必须记下来：切走之后用户的作答要发回给发问方，而不是发给他正在看的那个 ——
     否则 A 会话的确认会被当成对 B 的作答（本文件曾用全局 SID，就是这个错）。 */
  const owner = sid || ev.session || activeViewId;
  state.pendingConfirm=Object.assign({}, ev, {session:owner});
  $("#cmdText").textContent=ev.command||"";
  const why = ev.reason==="ask-all" ? "权限模式为「每条命令询问」" : "⚠️ 该命令可能危险，需要批准";
  $("#why").textContent = why;
  // 若当前查看的不是发问方，显式标出来源，避免用户以为在给当前会话作答
  const tag = $("#confirmFrom");
  if(tag) tag.textContent = (owner===activeViewId) ? "" : ("来自会话 " + owner);
  $("#overlay").classList.add("show");
}
function hideConfirm(){
  $("#overlay").classList.remove("show");
  state.pendingConfirm=null;
  const tag=$("#confirmFrom"); if(tag) tag.textContent="";
}
/* 切会话时把确认框的**归属**同步过来：
   发问方就是新会话 → 重新弹出；否则收起（答案不能落到错误的会话上）。
   注意沿用 pendingConfirm 里已有的 uid，不重新构造事件。 */
function syncConfirmToView(){
  const ev = state.pendingConfirm;
  if(ev && ev.session === activeViewId){
    $("#cmdText").textContent=ev.command||"";
    const tag=$("#confirmFrom"); if(tag) tag.textContent="";
    $("#overlay").classList.add("show");
  }else{
    $("#overlay").classList.remove("show");
  }
}
$("#approveBtn").addEventListener("click", async()=>{ await answerConfirm(true); });
$("#rejectBtn").addEventListener("click", async()=>{ await answerConfirm(false); });
async function answerConfirm(approve){
  const ev=state.pendingConfirm;
  const owner=(ev && ev.session) || activeViewId;   // 发问方，不是「正在看的」
  hideConfirm();
  if(!ev) return;
  await fetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session:owner,uid:ev.uid,approve})});
}

/* ---------------- 停止 / 导出 ---------------- */
async function stopRun(){
  const sid=activeViewId;                  // 只停**当前会话**，不碰别的会话在跑的轮次
  // ⚠️ 不要在这里 `if(!isRunning(sid)) return;`：本地 runs 表只是**镜像**，
  //    可能与后端不一致（如刷新后、或事件流漏了一段）。那样会在「后端其实在跑」
  //    时直接返回 —— 用户按了按钮，却**一点反馈都没有**（本文件曾如此）。
  //    改为总是问后端一次，由后端的事实回答「到底有没有在跑」。
  const wasRunning = isRunning(sid);
  if(wasRunning){
    // 先清 detached：否则下面 abort 触发的 AbortError 会被当成「切走」而静默吞掉
    setRun(sid,{detached:false, state:"cancelling"});
    try{ const c=getRun(sid).controller; if(c) c.abort(); }catch(e){}
    setRun(sid,{controller:null});
  }
  try{
    const j=await (await fetch("/api/cancel",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session:sid})})).json();
    // 后端只能协作式取消：正在执行的 Bash 要等它自己超时返回，如实说明
    if(j && j.cancelled===false){
      notice(wasRunning
        ? "已请求中断，但后端未记录到运行中的轮次（可能刚刚已结束）。"
        : "该会话当前没有正在运行的轮次。");
    }
  }catch(e){
    notice("中断请求失败：" + (e && e.message ? e.message : e));
  }
  refreshRunBar();
}

function exportChat(){
  // 折叠用的是 overflow:hidden（不是 display:none），innerText 仍能拿到被裁掉的文字，
  // 所以导出无需先展开；工具卡历来读 textContent，也早就免疫。
  const lines=[];
  chatEl.querySelectorAll(".msg").forEach(m=>{
    const who = m.classList.contains("user") ? "你" : "TraitPilot";
    const bubble = m.querySelector(".bubble");
    if(!bubble) return;
    // 工具卡内容
    const cards=[...bubble.querySelectorAll(".tool-card")].map(c=>{
      const nm=c.querySelector(".nm")?.textContent||"tool";
      const args=c.querySelector(".body pre")?.textContent||"";
      const res=c.querySelector(".res")?.textContent||"";
      return `  [工具 ${nm}] 参数: ${args.replace(/\s+/g," ").slice(0,300)}\n  结果: ${res.slice(0,800)}`;
    });
    // 正文（排除工具卡，取 .md 文本）
    const mdEls=[...bubble.querySelectorAll(".md")];
    const body=mdEls.map(e=>e.innerText.trim()).filter(Boolean).join("\n");
    let block=`### ${who}\n${body}`;
    if(cards.length) block+="\n"+cards.join("\n");
    if(block.trim()) lines.push(block);
  });
  const header=`# TraitPilot 对话导出\n\n- 时间：${new Date().toLocaleString()}\n- 模型：${state.model}\n- 项目：${$("#proj").textContent}\n\n---\n\n`;
  const blob=new Blob([header+lines.join("\n\n---\n\n")],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`traitpilot-${SID}-${Date.now()}.md`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

function backToCurrent(){ viewingHistory=false; setCurrent(SID); chatEl.innerHTML=""; curAssist=curFlow=curTextBox=null; renderSessions(); }
/* activeViewId 的**唯一写入口**：它一变，「当前查看的会话」就变了，
   state.busy 镜像必须跟着重算 —— 漏掉这一步会让发送按钮停在上一个会话的形态
   （看着空闲的会话却显示「停止」，点下去走 stopRun 而不是 send）。 */
function setCurrent(id){
  SID=id; localStorage.sid=id; sessionStorage.sid=id;
  const changed = (activeViewId !== id);
  activeViewId=id;
  if(changed){
    syncBusyToView();
    /* 确认框的**归属**随视图同步：发问方是新会话才显示，否则收起。
       在 setCurrent 里做（而不是 selectSession 的某条分支）是因为这里是**唯一**的
       视图写入口 —— 否则漏掉某条 return 路径，就会留下「A 的确认框挂在 B 上」
       的状态，用户一按就把答案发给 B（曾如此）。 */
    if(typeof syncConfirmToView==="function") syncConfirmToView();
  }
}

const inputEl=$("#input"), sendBtn=$("#sendBtn");
inputEl.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); onPrimary(); }
});
inputEl.addEventListener("input", autosize);
// 发送按钮在空闲时=发送，运行中=强制中断
sendBtn.addEventListener("click", onPrimary);
function onPrimary(){ if(state.busy) stopRun(); else send(); }
function autosize(){ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px"; }
function setBusy(b){
  state.busy=b;
  /* 关键：**不禁用输入框**。这正是用户报的「跑起来对话框就锁死，不能切换到别的对话」。
     后台在跑的会话必须能一边跑一边继续跟别的会话对话，所以这里只切按钮形态。
     「本会话在跑时不要再发一条」由 send() 用 isRunning(sid) 单独判（这是 409 的前置检查，
     是必要的：同一会话并发两条会打架）。 */
  $("#stopBtn").style.display = b ? "" : "none";
  const run=document.getElementById("sendIconRun"), idle=document.getElementById("sendIconIdle");
  if(run&&idle){ run.style.display=b?"":"none"; idle.style.display=b?"none":""; }
  sendBtn.classList.toggle("running", b);
  sendBtn.title = b ? "强制中断本轮任务" : "发送";
}
/* 中断/异常收尾：把流式中的思考与正文落定，并重算折叠 —— 否则被打断的那段
   会停在「还没渲染 + 没折叠」的状态（Bash 的中断路径以前什么都不做）。 */
function cleanupTurn(){
  clearThinking(); finalizeThink(); flushRender();
  fitFolds();
}

/* ---------------- 滚动 ---------------- */
// 本轮运行中始终自动贴底（用户上翻查看时可临时脱离，回到底部附近即恢复吸附）
let stick=true;
function nearBottom(){ const d=chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight; return d<80; }
function scrollBottom(){ chatEl.scrollTop=chatEl.scrollHeight; }
let tmr=null;
function throttleScroll(){ if(tmr) return; tmr=setTimeout(()=>{ tmr=null; if(stick||nearBottom()) scrollBottom(); },100); }
// 用 rAF 在每次 DOM 变化后统一贴底，保证「思考/流式文本/工具卡」都能自动往下滚
let rafPending=false;
function scheduleBottom(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; if(stick||nearBottom()) scrollBottom(); });
}
// 性能：批处理 DOM 观察回调，避免每一帧都触发布局读取
let obsPending=false;
const _obs=new MutationObserver(()=>{
  if(obsPending) return;
  obsPending=true;
  requestAnimationFrame(()=>{ obsPending=false; scheduleBottom(); fitFoldsSoon(); });
});
_obs.observe(chatEl,{childList:true,subtree:true,characterData:true});
chatEl.addEventListener("scroll", ()=>{ stick=nearBottom(); });

/* ---------------- 长内容折叠（前几行 + 点击展开） ---------------- */
/* 内容默认用 CSS max-height 裁到前 N 行；这里只负责「谁真的超长了」——
   只有 scrollHeight 明显超出可视高度才挂 .fold（可点 + 角标），短内容完全不显示折叠痕迹。
   为什么用测量而不是无脑套 clamp：见 CSS 里 .foldable 的注释。
   ⚠️ 必须在**可见态**测量。这里有个前提：切换会话/初始化之后代码会 `scrollBottom()` 贴底，
   所以「刚渲染完」量到的位置反而在视口外（元素被贴到底部了）——按视口过滤会漏掉整屏内容，
   只剩末尾一两条。真正的隐藏态只有未展开的工具卡体（display:none，量到恒 0），
   所以过滤条件就是它，不再看视口；单次渲染的元素数量有限，不做视口过滤也不会卡。 */
const FOLD_SEL="pre,.tw,blockquote";
function isMeasurable(el){
  return !el.closest(".tool-card:not(.open)");   // display:none 的工具卡体：等它展开再量
}
/* root 省略 = 全量补扫（初始化 / 展开工具卡 / 结果回填）；给 root = 只处理这一块 */
function fitFolds(root){
  (root||chatEl).querySelectorAll(FOLD_SEL).forEach(el=>{
    if(el.closest(".think-box")||el.closest(".modal")) return;   // 思考块 / 权限弹窗自有一套，别动
    if(el.closest(".tw") && !el.classList.contains("tw")) return; // 表格折外层 .tw，不折内层 table
    el.classList.add("foldable");
    if(el.hasAttribute("data-fold") || !isMeasurable(el)) return;
    el.setAttribute("data-fold","1");
    applyFold(el);
  });
}
function applyFold(el){
  if(!isMeasurable(el)) return;                      // display:none 时 scrollHeight 恒为 0，量了会误判
  if(el.classList.contains("fold-open")){
    // 已展开：把上限放到「大致整块」再量，否则 420px 的封顶会让它永远显示为溢出
    el.style.maxHeight="none";
    void el.offsetHeight;
    const full=el.scrollHeight;
    el.style.maxHeight="";
    el.classList.toggle("fold", full>el.clientHeight+2);
    return;
  }
  el.classList.toggle("fold", el.scrollHeight>el.clientHeight+2);
}
/* 窗口尺寸变化 → 行高变了 → 重新判定 */
function refits(){ chatEl.querySelectorAll(".foldable").forEach(applyFold); }

/* DOM 变动（流式正文每 200ms 重建、历史回放、工具结果回填）后补扫一次。
   只加/改 class 不触发 MutationObserver（它只观察 childList/characterData），不会自激循环。 */
let foldPending=false;
function fitFoldsSoon(){
  if(foldPending) return;
  foldPending=true;
  requestAnimationFrame(()=>{ foldPending=false; fitFolds(); });
}

/* 展开/收起：一条事件委托覆盖三条建 <pre> 的路径（实时 toolStart、增量 toolEnd、历史回放）。
   点整卡表头展开时也要顺带量一次刚露出来的参数/结果。 */
chatEl.addEventListener("click", e=>{
  if(e.target.closest(".tool-card .hd")){ requestAnimationFrame(()=>fitFolds()); return; }
  if(e.target.closest(".think-box")) return;
  const el=e.target.closest(".foldable.fold");
  if(!el) return;
  // 拖选复制长内容时，抬手那一下不该把刚选中的块收起
  const s=getSelection();
  if(s && !s.isCollapsed && el.contains(s.anchorNode)) return;
  el.classList.toggle("fold-open");
  applyFold(el);
  stick=false;                       // 别让后续流式的自动贴底把刚展开的位置拽走
  scrollBottom();
});

/* 折叠的「行数阈值」是 CSS 像素上限，字体/换行变化都要重新量一遍 */
window.addEventListener("resize", ()=>{ clearTimeout(fitFolds._t);
  fitFolds._t=setTimeout(refits,200); });

/* ---------------- 工具 ---------------- */
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function safeJson(o){
  try{ return typeof o==="string"?o:JSON.stringify(o,null,2); }catch(e){ return String(o); }
}

/* ---- 轻量 Markdown（离线、XSS 安全：先转义再排版）---- */
function md(src){
  const lines=String(src).replace(/\r\n/g,"\n").split("\n");
  let out=[], i=0, guard=0;
  const esc = escapeHtml;
  const inline = s => s.split("`").map((seg,i)=> i%2 ? `<code>${escapeHtml(seg)}</code>` : escapeHtml(seg)).join("")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>u.startsWith("http")
      ?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`
      :`<code>${t} (${u})</code>`);
  while(i<lines.length){
    const l=lines[i];
    if(/^```/.test(l)){                 // 代码块
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`); continue;
    }
    if(i+1<lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1]) && l.startsWith("|")){  // 表格
      const hdr=l.slice(1,-1).split("|").map(s=>s.trim());
      const recs=[];
      i+=2;
      while(i<lines.length && lines[i].startsWith("|")){
        recs.push(lines[i].slice(1,-1).split("|").map(s=>inline(s.trim()))); i++;
      }
      out.push(`<div class="tw"><table><thead><tr>${hdr.map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead>`
        +`<tbody>${recs.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h=l.match(/^(#{1,6})\s+(.*)/);
    if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(l.startsWith("> ")){ const b=[]; while(i<lines.length&&lines[i].startsWith("> ")){ b.push(lines[i].slice(2)); i++; } out.push(`<blockquote>${md(b.join("\n"))}</blockquote>`); continue; }
    if(/^[-*+]\s+/.test(l)){ const items=[]; while(i<lines.length&&/^[-*+]\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^[-*+]\s+/,""))); i++; } out.push(`<ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul>`); continue; }
    if(/^\d+\.\s+/.test(l)){ const items=[]; while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){ items.push(inline(lines[i].replace(/^\d+\.\s+/,""))); i++; } out.push(`<ol>${items.map(x=>`<li>${x}</li>`).join("")}</ol>`); continue; }
    if(l.trim()===""){ i++; continue; }          // 段落
    const par=[]; while(i<lines.length && lines[i].trim()!=="" && !/^```/.test(lines[i])
       && !/^\|/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^[-*+]\s/.test(lines[i])
       && !/^\d+\.\s/.test(lines[i]) && !/^> /.test(lines[i])){ par.push(lines[i]); i++; }
    out.push(`<p>${par.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}
